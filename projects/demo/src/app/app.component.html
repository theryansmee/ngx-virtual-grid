<button
	class="menu-toggle"
	aria-label="Toggle navigation"
	[class.open]="menuOpen"
	(click)="menuOpen = !menuOpen">
	<span></span>
	<span></span>
	<span></span>
</button>

<aside
	class="sidebar"
	[class.open]="menuOpen">

	<div class="sidebar__header">

		<a
			routerLink="/"
			(click)="closeMenu()">
			<h1>ngx-virtual-grid</h1>
		</a>

		<p>The grid solution Angular CDK doesn't offer.</p>
	</div>

	<nav class="sidebar__nav">
		<a
			routerLink="/"
			routerLinkActive="active"
			[routerLinkActiveOptions]="{ exact: true }"
			(click)="closeMenu()">
			Home
		</a>
		<a
			routerLink="/demo"
			routerLinkActive="active"
			(click)="closeMenu()">
			Demo
		</a>
		<a
			routerLink="/getting-started"
			routerLinkActive="active"
			(click)="closeMenu()">
			Getting Started
		</a>
		<a
			routerLink="/api"
			routerLinkActive="active"
			(click)="closeMenu()">
			API Reference
		</a>
		<a
			routerLink="/layouts"
			routerLinkActive="active"
			(click)="closeMenu()">
			Layouts
		</a>
	</nav>
	<div class="sidebar__footer">
		<div class="sidebar__links">
			<a href="https://github.com/theryansmee/ngx-virtual-grid" target="_blank" rel="noopener">GitHub</a>
			<a href="https://www.npmjs.com/package/@theryansmee/ngx-virtual-grid" target="_blank" rel="noopener">npm</a>
		</div>
	</div>
</aside>

<div class="backdrop" [class.visible]="menuOpen" (click)="closeMenu()"></div>

<main class="content">
	<router-outlet></router-outlet>
</main>
